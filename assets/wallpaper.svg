<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a4a"/>
      <stop offset=".55" stop-color="#3a2a95"/>
      <stop offset="1" stop-color="#8a3fb0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7fd8ff" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#4c7dff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#4c7dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3da5ff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#9b5cff" stop-opacity=".75"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b7bff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#e46bd6" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="w3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d4fd8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6a3cff" stop-opacity=".6"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1180" cy="430" r="620" fill="url(#glow)"/>
  <!-- soft bloom petals -->
  <g opacity=".55" transform="translate(1180 430)">
    <ellipse rx="150" ry="360" fill="#8fd0ff" opacity=".28" transform="rotate(0)"/>
    <ellipse rx="150" ry="360" fill="#b69bff" opacity=".28" transform="rotate(60)"/>
    <ellipse rx="150" ry="360" fill="#6aa7ff" opacity=".28" transform="rotate(120)"/>
  </g>
  <!-- waves -->
  <path d="M0 640 C 320 520 560 760 900 650 S 1560 520 1920 640 V1080 H0Z" fill="url(#w1)"/>
  <path d="M0 760 C 380 640 640 900 1020 780 S 1620 680 1920 780 V1080 H0Z" fill="url(#w2)"/>
  <path d="M0 880 C 420 800 700 980 1100 890 S 1680 830 1920 900 V1080 H0Z" fill="url(#w3)"/>
  <path d="M0 640 C 320 520 560 760 900 650 S 1560 520 1920 640" fill="none" stroke="#bfe6ff" stroke-opacity=".5" stroke-width="2"/>
  <path d="M0 760 C 380 640 640 900 1020 780 S 1620 680 1920 780" fill="none" stroke="#f1c9ff" stroke-opacity=".4" stroke-width="2"/>
</svg>

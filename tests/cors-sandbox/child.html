<!doctype html>
<meta charset="utf-8">
<title>cors-sandbox child</title>
<link rel="icon" href="data:,">
<!-- Loaded inside the sandboxed iframe in index.html: opaque origin, so module imports and fetch() are cross-origin. -->
<script type="module">
  const result = { origin: self.origin, opaque: false, import: false, fetch: false, notes: [] };
  try { void window.parent.document.body; } catch (e) { result.opaque = true; }   // reachable parent = sandbox not applied
  try {
    const m = await import('./module.mjs');
    result.import = m.answer === 42;
    if (!result.import) result.notes.push('module loaded but exports are wrong');
  } catch (e) { result.notes.push('import failed: ' + e.message); }
  try {
    const res = await fetch('./tiny.glb');
    const bytes = new Uint8Array(await res.arrayBuffer());
    const view = new DataView(bytes.buffer);
    const magic = String.fromCharCode(...bytes.slice(0, 4));
    result.fetch = res.ok && magic === 'glTF' && view.getUint32(4, true) === 2 && view.getUint32(8, true) === bytes.length;
    result.bytes = bytes.length;
    if (!result.fetch) result.notes.push(`glb check failed: status ${res.status}, magic ${magic}`);
  } catch (e) { result.notes.push('fetch failed: ' + e.message); }
  window.parent.postMessage({ source: 'cors-sandbox', result }, '*');
</script>
